name: IT Label Approval Required for main

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

jobs:
  check-approval:
    runs-on: ubuntu-latest
    # pull_request_reviewイベントではpull_requestが直接存在しないため、条件を調整
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'pull_request_review') ||
      (github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check IT label and approval requirement
        id: check_protection
        uses: actions/github-script@v7
        with:
          script: |
            const REQUIRED_APPROVAL_COUNT = 1;
            const IT_LABEL = 'IT';
            
            function getPRNumber() {
              // pull_request イベントの場合
              if (context.payload.pull_request) {
                return context.payload.pull_request.number;
              }
              // pull_request_review イベントの場合
              if (context.payload.review?.pull_request_url) {
                const match = context.payload.review.pull_request_url.match(/\/pulls\/(\d+)$/);
                if (match) return parseInt(match[1]);
              }
              // フォールバック: issue.number を使用（pull_request_review イベントで利用可能）
              if (context.issue?.number) {
                return context.issue.number;
              }
              return null;
            }
            
            function getLatestReviewsByUser(reviews) {
              const latestByUser = new Map();
              reviews.forEach(review => {
                if (review.state === 'DISMISSED') return;
                const user = review.user.login;
                const existing = latestByUser.get(user);
                if (!existing || new Date(review.submitted_at) > new Date(existing.submitted_at)) {
                  latestByUser.set(user, review);
                }
              });
              return latestByUser;
            }
            
            function getApprovers(latestReviewsByUser) {
              return Array.from(latestReviewsByUser.values())
                .filter(review => review.state === 'APPROVED')
                .map(review => review.user.login);
            }
            
            try {
              const prNumber = getPRNumber();
              if (!prNumber) {
                // workflow_dispatch の場合、PR コンテキストがないためスキップ
                if (context.eventName === 'workflow_dispatch') {
                  core.setOutput('skip', 'true');
                  core.setOutput('status', 'skipped');
                  console.log('workflow_dispatch event: PR context not available, skipping check');
                  return;
                }
                core.setFailed('Could not determine PR number from context');
                return;
              }
              
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              
              // pull_request_reviewイベントでもbase.refをチェック
              if (pr.base.ref !== 'main') {
                core.setOutput('skip', 'true');
                core.setOutput('status', 'skipped');
                console.log(`PR #${prNumber} targets ${pr.base.ref}, not main. Skipping check.`);
                return;
              }
              
              const labels = pr.labels.map(label => label.name);
              const hasITLabel = labels.includes(IT_LABEL);
              const commitSha = context.sha; // Merge commit SHA for PR events
              
              console.log(`PR #${prNumber}: labels=[${labels.join(', ')}], hasITLabel=${hasITLabel}, commitSha=${commitSha}`);
              
              // PR 情報を次のステップで再利用するために出力
              core.setOutput('prNumber', prNumber.toString());
              
              if (!hasITLabel) {
                core.setOutput('skip', 'true');
                core.setOutput('status', 'skipped');
                return;
              }
              
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              
              const latestReviewsByUser = getLatestReviewsByUser(reviews);
              const approvers = getApprovers(latestReviewsByUser);
              const approvalCount = approvers.length;
              const hasApproval = approvalCount >= REQUIRED_APPROVAL_COUNT;
              
              console.log(`Approval count: ${approvalCount}, approvers: [${approvers.join(', ') || 'None'}]`);
              
              core.setOutput('skip', 'false');
              core.setOutput('approvalCount', approvalCount.toString());
              core.setOutput('approvers', JSON.stringify(approvers));
              core.setOutput('status', hasApproval ? 'success' : 'failure');
              
            } catch (error) {
              console.error('Error checking approval:', error);
              // エラーをログに記録するが、ステップは成功として続行
              // 次のステップでエラー状態のチェックを作成できるようにする
              core.setOutput('skip', 'false'); // エラーはスキップではない
              core.setOutput('status', 'error');
              core.setOutput('error', error.message);
              console.warn('Continuing despite error to allow check creation');
            }

      - name: Create check status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const CHECK_NAME = 'IT Label Approval Check';
            
            function parseApprovers(approversJson) {
              try {
                return JSON.parse(approversJson);
              } catch (e) {
                return approversJson ? approversJson.split(', ') : [];
              }
            }
            
            function getSummary(skip, status, approvalCount, approvers, error) {
              if (error) {
                return `⚠️ Error occurred during approval check: ${error}\nPlease check the workflow logs for details.`;
              }
              if (skip === 'true') {
                return 'IT label not present. Approval check skipped.';
              }
              if (status === 'success') {
                const approversList = approvers.join(', ') || 'None';
                return `✅ Approval check passed: ${approvalCount} approval(s) found.\nApprovers: ${approversList}`;
              }
              return `❌ Approval check failed: At least 1 approval is required for PRs with IT label targeting main.\nCurrent approval count: ${approvalCount}`;
            }
            
            async function findAllExistingChecks(repo, sha) {
              // context.shaを使用して既存チェックを探す
              const allChecks = [];
              
              try {
                const { data: checks } = await github.rest.checks.listForRef({
                  owner: repo.owner,
                  repo: repo.repo,
                  ref: sha,
                });
                allChecks.push(...checks.check_runs.filter(check => check.name === CHECK_NAME));
              } catch (error) {
                console.warn(`Failed to list checks for SHA ${sha}: ${error.message}`);
              }
              
              // Remove duplicates by check ID
              return Array.from(new Map(allChecks.map(check => [check.id, check])).values());
            }
            
            async function cancelChecks(repo, checks) {
              for (const check of checks) {
                try {
                  await github.rest.checks.update({
                    owner: repo.owner,
                    repo: repo.repo,
                    check_run_id: check.id,
                    status: 'completed',
                    conclusion: 'cancelled',
                    output: { title: CHECK_NAME, summary: 'Cancelled and recreated' }
                  });
                  console.log(`Cancelled check: ${CHECK_NAME} (ID: ${check.id}, SHA: ${check.head_sha})`);
                } catch (error) {
                  console.warn(`Failed to cancel check ${check.id}: ${error.message}`);
                }
              }
            }
            
            async function createCheck(repo, headSha, conclusion, summary) {
              await github.rest.checks.create({
                owner: repo.owner,
                repo: repo.repo,
                name: CHECK_NAME,
                head_sha: headSha,
                status: 'completed',
                conclusion: conclusion,
                output: { title: CHECK_NAME, summary: summary }
              });
              console.log(`Created check: ${CHECK_NAME} (${conclusion}) on SHA: ${headSha}`);
            }
            
            try {
              const skip = '${{ steps.check_protection.outputs.skip }}';
              const status = '${{ steps.check_protection.outputs.status }}';
              const approvalCount = '${{ steps.check_protection.outputs.approvalCount }}';
              const approversJson = '${{ steps.check_protection.outputs.approvers }}';
              const prNumber = '${{ steps.check_protection.outputs.prNumber }}';
              const error = '${{ steps.check_protection.outputs.error }}';
              
              // context.shaを使用（すべてのイベントタイプで一貫して使用）
              const commitSha = context.sha;
              
              // Skip if workflow_dispatch and no PR context
              if (skip === 'true' && !prNumber && !error && status === 'skipped') {
                console.log('Skipping check creation: no PR context available');
                return;
              }
              
              if (!commitSha) {
                console.error('Missing required data: context.sha is empty');
                // context.shaが取得できない場合は、エラーチェックを作成して終了
                if (prNumber) {
                  try {
                    const { data: pr } = await github.rest.pulls.get({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: parseInt(prNumber),
                    });
                    const fallbackSha = pr.head.sha;
                    await createCheck(context.repo, fallbackSha, 'failure', '⚠️ Error: Could not determine commit SHA from context');
                    core.setFailed('Missing required data: context.sha is empty');
                    return;
                  } catch (e) {
                    console.error('Failed to get PR for fallback SHA:', e);
                  }
                }
                core.setFailed('Missing required data: context.sha is empty');
                return;
              }
              
              const repo = context.repo;
              const approvers = parseApprovers(approversJson || '[]');
              // エラーが発生した場合（status === 'error' または error が存在）は 'failure' として扱うが、チェックは作成する
              const hasError = error || status === 'error';
              const conclusion = hasError ? 'failure' : (skip === 'true' ? 'skipped' : (status === 'success' ? 'success' : 'failure'));
              const summary = getSummary(skip, status, approvalCount || '0', approvers, error || null);
              
              // context.shaを使用して既存チェックを探してキャンセル
              const existingChecks = await findAllExistingChecks(repo, commitSha);
              if (existingChecks.length > 0) {
                console.log(`Cancelling ${existingChecks.length} existing check(s) for SHA ${commitSha}`);
                await cancelChecks(repo, existingChecks);
              }
              
              // context.shaを使用してチェックを作成
              await createCheck(repo, commitSha, conclusion, summary);
              
              // エラーが発生した場合のみワークフローを失敗として終了
              // 承認不足（status === 'failure'）は正常な状態であり、チェックをfailureとして作成するだけで十分
              if (hasError) {
                core.setFailed(`Error during approval check: ${error || 'Unknown error'}`);
              }
              // 承認不足の場合は、チェックをfailureとして作成しただけで、ワークフロー自体は成功として終了
            } catch (error) {
              console.error('Error creating check status:', error);
              // エラーが発生しても、可能な限りチェックを作成を試みる
              try {
                const commitSha = context.sha;
                if (commitSha) {
                  await createCheck(context.repo, commitSha, 'failure', `⚠️ Error creating check: ${error.message}`);
                }
              } catch (createError) {
                console.error('Failed to create error check:', createError);
              }
              // エラーをログに記録するが、throwしない（ステップは成功として終了）
              core.setFailed(`Failed to create check status: ${error.message}`);
            }

