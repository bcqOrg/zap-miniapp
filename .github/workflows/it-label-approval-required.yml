name: IT Label Approval Required for main

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

jobs:
  check-approval:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check IT label and approval requirement
        id: check_protection
        uses: actions/github-script@v7
        with:
          script: |
            const REQUIRED_APPROVAL_COUNT = 1;
            const IT_LABEL = 'IT';
            
            // Get PR number from context
            function getPRNumber() {
              // For pull_request events
              if (context.payload.pull_request) {
                return context.payload.pull_request.number;
              }
              // For pull_request_review events
              if (context.payload.review && context.payload.review.pull_request_url) {
                const match = context.payload.review.pull_request_url.match(/\/pulls\/(\d+)$/);
                if (match) return parseInt(match[1]);
              }
              // Fallback to issue number (works for pull_request events)
              return context.issue.number;
            }
            
            // Get latest review for each user (excluding dismissed reviews)
            function getLatestReviewsByUser(reviews) {
              const latestByUser = new Map();
              reviews.forEach(review => {
                if (review.state === 'DISMISSED') return;
                
                const user = review.user.login;
                const existing = latestByUser.get(user);
                if (!existing || new Date(review.submitted_at) > new Date(existing.submitted_at)) {
                  latestByUser.set(user, review);
                }
              });
              return latestByUser;
            }
            
            // Get approvers from reviews
            function getApprovers(latestReviewsByUser) {
              return Array.from(latestReviewsByUser.values())
                .filter(review => review.state === 'APPROVED')
                .map(review => review.user.login);
            }
            
            try {
              const prNumber = getPRNumber();
              console.log(`Event: ${context.eventName}, Action: ${context.payload.action}`);
              console.log(`PR Number: ${prNumber}`);
              
              if (!prNumber) {
                core.setFailed('Could not determine PR number from context');
                return;
              }
              
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              
              const labels = pr.labels.map(label => label.name);
              const hasITLabel = labels.includes(IT_LABEL);
              
              console.log(`PR labels: ${labels.join(', ')}`);
              console.log(`Has IT label: ${hasITLabel}`);
              console.log(`Head SHA: ${pr.head.sha}`);
              
              // If no IT label, skip approval check
              if (!hasITLabel) {
                console.log('IT label not found. Skipping approval check.');
                core.setOutput('skip', 'true');
                core.setOutput('status', 'skipped');
                core.setOutput('headSha', pr.head.sha);
                return;
              }
              
              // Get and process reviews
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              
              const latestReviewsByUser = getLatestReviewsByUser(reviews);
              const approvers = getApprovers(latestReviewsByUser);
              const approvalCount = approvers.length;
              const hasApproval = approvalCount >= REQUIRED_APPROVAL_COUNT;
              
              console.log(`Approval count: ${approvalCount}`);
              console.log(`Approvers: ${approvers.join(', ') || 'None'}`);
              
              core.setOutput('skip', 'false');
              core.setOutput('approvalCount', approvalCount.toString());
              core.setOutput('approvers', JSON.stringify(approvers));
              core.setOutput('headSha', pr.head.sha);
              core.setOutput('status', hasApproval ? 'success' : 'failure');
              
            } catch (error) {
              console.error('Error checking approval:', error);
              console.error('Context payload:', JSON.stringify(context.payload, null, 2));
              core.setFailed(`Failed to check approval: ${error.message}`);
              throw error;
            }

      - name: Create check status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const CHECK_NAME = 'IT Label Approval Check';
            
            // Parse approvers from JSON safely
            function parseApprovers(approversJson) {
              try {
                return JSON.parse(approversJson);
              } catch (e) {
                return approversJson ? approversJson.split(', ') : [];
              }
            }
            
            // Generate check summary message
            function getSummary(skip, status, approvalCount, approvers) {
              if (skip === 'true') {
                return 'IT label not present. Approval check skipped.';
              }
              
              if (status === 'success') {
                const approversList = approvers.join(', ') || 'None';
                return `✅ Approval check passed: ${approvalCount} approval(s) found.\nApprovers: ${approversList}`;
              }
              
              return `❌ Approval check failed: At least 1 approval is required for PRs with IT label targeting main.\nCurrent approval count: ${approvalCount}`;
            }
            
            // Find existing check
            async function findExistingCheck(repo, headSha) {
              const { data: existingChecks } = await github.rest.checks.listForRef({
                owner: repo.owner,
                repo: repo.repo,
                ref: headSha,
              });
              
              return existingChecks.check_runs.find(
                check => check.name === CHECK_NAME && check.head_sha === headSha
              );
            }
            
            // Cancel existing check
            async function cancelCheck(repo, checkId) {
              await github.rest.checks.update({
                owner: repo.owner,
                repo: repo.repo,
                check_run_id: checkId,
                status: 'completed',
                conclusion: 'cancelled',
                output: {
                  title: CHECK_NAME,
                  summary: 'Cancelled and recreated'
                }
              });
              console.log(`Cancelled existing check: ${CHECK_NAME}`);
            }
            
            // Create new check
            async function createCheck(repo, headSha, conclusion, summary) {
              await github.rest.checks.create({
                owner: repo.owner,
                repo: repo.repo,
                name: CHECK_NAME,
                head_sha: headSha,
                status: 'completed',
                conclusion: conclusion,
                output: { title: CHECK_NAME, summary: summary }
              });
              console.log(`Created new check: ${CHECK_NAME}`);
            }
            
            try {
              const skip = '${{ steps.check_protection.outputs.skip }}';
              const status = '${{ steps.check_protection.outputs.status }}';
              const approvalCount = '${{ steps.check_protection.outputs.approvalCount }}';
              const approversJson = '${{ steps.check_protection.outputs.approvers }}';
              const headSha = '${{ steps.check_protection.outputs.headSha }}';
              
              console.log('=== Check Status Creation ===');
              console.log(`Event: ${context.eventName}, Action: ${context.payload.action}`);
              console.log(`skip: ${skip}, status: ${status}, headSha: ${headSha}`);
              console.log(`approvalCount: ${approvalCount}, approvers: ${approversJson}`);
              
              if (!headSha) {
                core.setFailed('headSha is not set. Previous step may have failed.');
                return;
              }
              
              const repo = context.repo;
              const approvers = parseApprovers(approversJson);
              const conclusion = skip === 'true' ? 'skipped' : (status === 'success' ? 'success' : 'failure');
              const summary = getSummary(skip, status, approvalCount, approvers);
              
              console.log(`Conclusion: ${conclusion}`);
              console.log(`Summary: ${summary}`);
              
              // Cancel existing check if exists
              const existingCheck = await findExistingCheck(repo, headSha);
              if (existingCheck) {
                console.log(`Found existing check with ID: ${existingCheck.id}`);
                await cancelCheck(repo, existingCheck.id);
              } else {
                console.log('No existing check found');
              }
              
              // Create new check
              await createCheck(repo, headSha, conclusion, summary);
              console.log('Check created successfully');
              
              // Fail the job if approval is missing
              if (status === 'failure') {
                core.setFailed('At least 1 approval is required for PRs with IT label targeting main.');
              }
            } catch (error) {
              console.error('=== Error creating check status ===');
              console.error('Error:', error);
              console.error('Error message:', error.message);
              console.error('Error stack:', error.stack);
              core.setFailed(`Failed to create check status: ${error.message}`);
              throw error;
            }

